zh:{brand:"HSIN-TING,HSU 醫美諮詢需求",eyebrow:"CONSULTATION BRIEF",headline:"鼻子",intro:"希望與院長討論目前的狀況、可能的改善方式，以及各方案能達到的效果與限制。這份資料用來協助溝通，並請醫師依現場檢查提出判斷。",chipNose:"鼻子",chipLift:"臉部拉提",chipForehead:"額頭與眼周",navNose:"隆鼻需求",navLift:"拉提需求",navForehead:"其他需求",navHistory:"手術史與待確認資料",
noseTitle:"目前在意的地方與照片",noseIntro:"請醫生根據我提供的以下照片(正面、45 度、側面與仰視)，評估目前鼻形及隆鼻的可能方向。",noseGoalTag:"希望了解",noseGoal:"醫師您好，我希望朝「原生感的清純幼態直鼻」方向討論，重點是自然、親和，像天生就有好看的鼻形。以下是審美偏好，請依我的臉部條件評估可行性。",noseGoalPoints:["鼻樑與山根：希望是順直的直鼻線條；山根起點偏低，約在雙眼瞳孔連線高度。鼻樑高度自然即可，不想墊得過高，也希望避免通天鼻或視覺上拉長中庭。","鼻頭與風格：偏好秀智那種清純、精緻的感覺。希望鼻頭保留微圓的自然肉感，同時有清晰流暢的微亮點；不喜歡過度夾尖或太骨感。","整體重點：不希望視覺上拉長中庭。希望鼻唇角微抬，整體親和、無人工感，請醫師評估是否適合。"],noseQTag:"想請教醫師",noseQuestions:["以我的臉部比例，偏低的山根起點、自然直鼻線條與微抬鼻尖是否合適？","若要避免視覺上拉長中庭，鼻樑高度、鼻尖投射與鼻唇角應如何取捨？","哪些方式能接近上述風格？各方案的限制、風險、恢復期與長期變化是什麼？"],nosePhotoNote:"以下七張為實際照片，沒有比例尺，也不是 3D 掃描或術後模擬。請以現場檢查和標準化攝影判斷。",
liftTitle:"目前在意的地方與照片",liftIntro:"希望請院長先評估是否有需要處理的鬆弛部位，以及適合的改善方式。",liftGoalTag:"希望了解",liftGoal:"目前尚未明確指定拉提部位或術式。希望先了解您觀察到的問題與優先順序，再討論是否需要拉提。",liftQTag:"想請教醫師",liftQuestions:["您認為最值得改善的部位在哪裡？是否真的需要拉提？","有哪些手術或非手術方式？預期效果、維持時間與恢復期有何差異？","若與鼻部或額頭治療一起規劃，順序上有什麼建議？"],liftPhotoNote:"目前網站只有鼻部的七張多角度照片。拉提相關的近照、在意部位與既往療程資料尚待補充。",
foreheadTitle:"目前在意的地方與照片",foreheadIntro:"想分別釐清左右高低差，以及額頭輪廓較平的問題。",asymTag:"問題一",asymTitle:"左右高度不一致",asymText:"先前在台灣做過提眼肌相關手術，但目前兩側看起來仍有些高低差。當時醫師提到可能受到天生眉骨高低差影響，也曾提及額頭拉提一類的方式；具體說明已記不清楚。希望院長重新評估原因和改善空間。",volumeTag:"問題二",volumeTitle:"額頭較扁平",volumeText:"覺得額頭側面線條較平，希望了解是否適合增加飽滿度，以及怎樣的形狀會比較自然。",foreheadQTag:"想請教醫師",foreheadQuestions:["左右高低差主要來自眼瞼、眉毛位置、額頭軟組織，還是骨骼？需要做哪些檢查才能判斷？","若要改善對稱性，額頭拉提是否合適？可改善到什麼程度，有哪些限制與風險？","針對額頭扁平，有哪些增加飽滿度的方式？各方式的維持時間、風險和自然度如何？","高低差與額頭飽滿度可以一起規劃嗎？若不能，建議順序為何？"],
historyTitle:"過往手術與待確認資料",historyIntro:"先前的說法作為病史背景，請院長獨立判斷。",knownTag:"目前已知",knownText:"曾在台灣接受提眼肌相關手術。術後仍感覺兩側略有高低差。",confirmTag:"待補充",confirmList:["手術的正式名稱、日期與術式","術前及術後照片、病歷或手術紀錄","左右高低差最在意的是眼睛、眉毛，還是額頭的哪個位置","拉提最在意的具體部位及照片"],scopeNote:"「眉骨天生一高一低」與「可能需要額頭拉提」是對先前醫師說法的回憶，尚未在此確認為診斷或建議。",photoLabels:["正面","仰視 1","仰視 2","左 45°","左側","右 45°","右側"]},
ko:{brand:"HSIN-TING,HSU 미용의료 상담 요청서",eyebrow:"CONSULTATION BRIEF",headline:"코",intro:"현재 상태와 가능한 개선 방법, 각 방법의 기대 효과와 한계를 원장님과 상담하고 싶습니다. 이 자료는 상담을 돕기 위한 것이며, 최종 판단은 직접 진찰 후 부탁드립니다.",chipNose:"코",chipLift:"얼굴 리프팅",chipForehead:"이마와 눈 주변",navNose:"코 성형 상담",navLift:"리프팅 상담",navForehead:"기타 상담",navHistory:"수술 이력 및 확인 사항",
noseTitle:"현재 신경 쓰이는 부분과 사진",noseIntro:"원장님께서 제가 제공한 아래 사진(정면, 45도, 측면, 아래에서 촬영한 사진)을 바탕으로 현재 코 모양과 코 성형의 가능성을 평가해 주시기 바랍니다.",noseGoalTag:"상담 목적",noseGoal:"원장님, 저는 '원래 제 코처럼 자연스럽고 청순하며 어려 보이는 일자 코'를 원합니다. 인위적이지 않고 친근한 인상이 가장 중요합니다. 아래는 미적 선호 사항이므로 제 얼굴 조건에 맞는지 평가해 주세요.",noseGoalPoints:["콧대와 미간 시작점: 매끄러운 일자 라인을 원하지만, 콧대 시작점은 낮게, 대략 양쪽 동공을 잇는 선 높이에 두고 싶습니다. 콧대는 자연스러운 높이면 충분하며, 지나치게 높거나 이마에서 바로 이어지는 코, 중안부가 길어 보이는 인상은 피하고 싶습니다.","코끝과 분위기: 수지처럼 청순하고 섬세한 느낌을 선호합니다. 코끝에는 살짝 둥근 자연스러운 볼륨을 남기면서도 부드럽고 또렷한 하이라이트가 있으면 좋겠습니다. 지나치게 뾰족하거나 뼈대가 도드라져 보이는 코끝은 원하지 않습니다.","전체적인 핵심: 시각적으로 중안부가 길어 보이지 않기를 바랍니다. 비순각은 약간 들린 느낌을 원하며, 전체적으로 친근하고 인위적이지 않은 인상이 제게 적합한지 원장님께서 평가해 주세요."],noseQTag:"원장님께 드리는 질문",noseQuestions:["제 얼굴 비율에서 낮은 콧대 시작점, 자연스러운 일자 라인, 살짝 들린 코끝이 적합한가요?","중안부가 길어 보이지 않으려면 콧대 높이, 코끝 돌출 정도, 비순각을 어떻게 조절하는 것이 좋을까요?","이런 분위기에 접근할 수 있는 방법은 무엇이며, 각 방법의 한계·위험성·회복 기간·장기적인 변화는 무엇인가요?"],nosePhotoNote:"아래의 사진 7장은 실제 사진입니다. 축척이 없으며 3D 스캔이나 수술 후 시뮬레이션이 아닙니다. 직접 진찰과 표준화된 사진 촬영을 바탕으로 판단해 주세요.",
liftTitle:"현재 신경 쓰이는 부분과 사진",liftIntro:"먼저 개선이 필요한 처짐 부위가 있는지, 있다면 어떤 방법이 적절한지 평가받고 싶습니다.",liftGoalTag:"상담 목적",liftGoal:"아직 특정 부위나 시술·수술 방법을 정하지 않았습니다. 원장님께서 보시기에 중요한 문제와 우선순위를 먼저 알고 싶습니다.",liftQTag:"원장님께 드리는 질문",liftQuestions:["어느 부위의 개선이 가장 중요하다고 보시나요? 리프팅이 실제로 필요한가요?","수술 및 비수술 방법에는 무엇이 있나요? 예상 효과, 지속 기간, 회복 기간은 어떻게 다른가요?","코나 이마 치료와 함께 계획한다면 순서는 어떻게 하는 것이 좋을까요?"],liftPhotoNote:"현재 웹페이지에는 코 관련 사진 7장만 있습니다. 리프팅 관련 근접 사진, 구체적으로 신경 쓰이는 부위 및 과거 시술 이력은 추후 추가할 예정입니다.",
foreheadTitle:"현재 신경 쓰이는 부분과 사진",foreheadIntro:"좌우 높이 차이와 평평해 보이는 이마 윤곽을 각각 상담하고 싶습니다.",asymTag:"문제 1",asymTitle:"좌우 높이 차이",asymText:"과거 대만에서 눈꺼풀을 올리는 근육과 관련된 수술을 받았으나, 현재도 양쪽 높이가 약간 달라 보입니다. 당시 의사는 선천적인 눈썹뼈 높이 차이가 영향을 줄 수 있다고 설명했고 이마 리프팅과 같은 방법도 언급했던 것으로 기억하지만, 자세한 내용은 확실하지 않습니다. 원장님의 재평가를 받고 싶습니다.",volumeTag:"문제 2",volumeTitle:"평평한 이마",volumeText:"옆에서 봤을 때 이마 윤곽이 비교적 평평하다고 느낍니다. 자연스럽게 볼륨을 더할 수 있는지 알고 싶습니다.",foreheadQTag:"원장님께 드리는 질문",foreheadQuestions:["좌우 높이 차이는 주로 눈꺼풀, 눈썹 위치, 이마의 연부조직, 뼈 중 어디에서 비롯되나요? 판단에 필요한 검사는 무엇인가요?","대칭을 개선하기 위해 이마 리프팅이 적절한가요? 개선 가능한 정도, 한계와 위험성은 무엇인가요?","이마 볼륨을 더하는 방법에는 무엇이 있나요? 지속 기간, 위험성, 자연스러움은 어떻게 다른가요?","높이 차이와 이마 볼륨을 함께 계획할 수 있나요? 순서를 나누는 것이 좋다면 어떻게 하나요?"],
historyTitle:"과거 수술 및 확인 사항",historyIntro:"이전 의사의 설명은 병력 참고용이며, 원장님의 독립적인 판단을 부탁드립니다.",knownTag:"현재 확인된 내용",knownText:"대만에서 눈꺼풀을 올리는 근육과 관련된 수술을 받은 적이 있습니다. 수술 후에도 좌우 높이가 약간 달라 보인다고 느낍니다.",confirmTag:"추후 확인할 내용",confirmList:["정확한 수술명, 수술 날짜 및 수술 방법","수술 전후 사진, 진료 기록 또는 수술 기록","좌우 차이 중 가장 신경 쓰이는 위치가 눈꺼풀, 눈썹, 이마 중 어디인지","리프팅에서 가장 신경 쓰이는 부위와 관련 사진"],scopeNote:"‘선천적인 눈썹뼈 높이 차이’와 ‘이마 리프팅 가능성’은 이전 설명에 대한 기억이며, 확정된 진단이나 권고가 아닙니다.",photoLabels:["정면","아래 1","아래 2","왼쪽 45°","왼쪽 측면","오른쪽 45°","오른쪽 측면"]},
en:{brand:"HSIN-TING,HSU Aesthetic consultation brief",eyebrow:"CONSULTATION BRIEF",headline:"Nose",intro:"I would like to discuss my current concerns, possible approaches, and the expected benefits and limits of each option. This page is a communication aid; please make your assessment after an in-person examination.",chipNose:"Nose",chipLift:"Facial lifting",chipForehead:"Forehead & eyes",navNose:"Rhinoplasty goals",navLift:"Lifting goals",navForehead:"Other goals",navHistory:"History & details to confirm",
noseTitle:"Current concerns and photos",noseIntro:"Doctor, please assess my current nose and possible rhinoplasty options based on the photos I have provided below (frontal, 45-degree, profile, and underside views).",noseGoalTag:"What I hope to learn",noseGoal:"Doctor, I would like to discuss a straight nose that looks naturally mine, with a soft, youthful, refined appearance. A friendly result without an artificial look matters most. These are aesthetic preferences; please assess what suits my anatomy.",noseGoalPoints:["Bridge and radix: I prefer a smooth, straight dorsal line, with a relatively low starting point around the level of a line connecting the pupils. A natural bridge height is enough; I want to avoid an overly high bridge, a nose that seems to begin at the forehead, or a longer-looking midface.","Tip and style: I like the pure, refined impression of Suzy's nose. I would like the tip to retain a little soft, rounded fullness while having a subtle, well-defined highlight. I do not want an over-pinched, pointed, or bony appearance.","Overall priority: I do not want my midface to look longer. I prefer a slightly lifted nasolabial angle and a friendly, natural appearance. Please assess whether this suits me."],noseQTag:"Questions for the surgeon",noseQuestions:["Would a low radix, natural straight bridge, and slightly lifted tip suit my facial proportions?","To avoid a longer-looking midface, how should bridge height, tip projection, and the nasolabial angle be balanced?","What approaches could achieve this style, and what are their limits, risks, recovery times, and long-term changes?"],nosePhotoNote:"These seven images are actual photographs without a measurement scale. They are not a 3D scan or a postoperative simulation. Please assess them alongside an in-person examination and standardized photography.",
liftTitle:"Current concerns and photos",liftIntro:"I would like your assessment of any areas of laxity that may need attention and the most appropriate options.",liftGoalTag:"What I hope to learn",liftGoal:"I have not selected a specific area or procedure. I would like to hear which concerns you consider most relevant, and whether lifting is needed at all.",liftQTag:"Questions for the surgeon",liftQuestions:["Which areas, if any, would benefit most from treatment? Is lifting necessary?","What surgical and nonsurgical options are available? How do their results, duration, and recovery differ?","If planning treatment with the nose or forehead, what sequence would you recommend?"],liftPhotoNote:"At present, this page contains seven nose-related photos only. Close-up lifting photos, specific areas of concern, and prior treatment details can be added later.",
foreheadTitle:"Current concerns and photos",foreheadIntro:"I would like to discuss the left–right height difference and the relatively flat forehead contour as separate concerns.",asymTag:"Concern 1",asymTitle:"Left–right height difference",asymText:"I previously had surgery in Taiwan involving the muscle that lifts the upper eyelid. The two sides still look slightly different in height. I recall being told that a natural difference in brow-bone height might be a factor, and that a forehead lift might be an option, but I do not remember the details. I would appreciate your independent assessment of the cause and the scope for improvement.",volumeTag:"Concern 2",volumeTitle:"Flat forehead contour",volumeText:"My forehead looks relatively flat in profile. I would like to know whether adding fullness is appropriate and what would look natural.",foreheadQTag:"Questions for the surgeon",foreheadQuestions:["Does the height difference mainly come from the eyelids, brow position, forehead soft tissue, or bone? What examination is needed to tell?","Would a forehead lift be appropriate for improving symmetry? What improvement is realistic, and what are the limits and risks?","What options could add forehead fullness? How do they compare in duration, risks, and natural appearance?","Can symmetry and fullness be planned together? If staged, what sequence would you suggest?"],
historyTitle:"Surgical history & details to confirm",historyIntro:"Please treat the previous doctor's comments as background and make an independent assessment.",knownTag:"Known so far",knownText:"I previously had surgery in Taiwan involving the muscle that lifts the upper eyelid. I still notice a slight height difference between the two sides.",confirmTag:"To confirm",confirmList:["Exact procedure name, date, and operative method","Before-and-after photos, medical records, or operative notes","Whether the most concerning difference is at the eyelids, brows, or forehead","Specific areas of concern for lifting and relevant photos"],scopeNote:"The comments about natural brow-bone asymmetry and a possible forehead lift are my recollection of a prior discussion, not a confirmed diagnosis or recommendation.",photoLabels:["Front","Underside 1","Underside 2","Left 45°","Left profile","Right 45°","Right profile"]}
};

const moodCopy={zh:{intro:`<p>希望參考 IU、秀智、金裕貞的自然精緻鼻型。</p><p><strong>整體目標：自然、清秀、柔和立體，不要明顯人工感。</strong></p><ol><li><strong>鼻頭</strong>：希望更集中、精緻，但保留自然圓潤度。</li><li><strong>鼻翼</strong>：希望適度收窄，改善外擴與左右不對稱。</li><li><strong>鼻孔</strong>：希望形狀自然、左右協調。</li><li><strong>鼻樑</strong>：希望線條細緻、流暢，有自然立體感。</li><li><strong>山根</strong>：不希望太高，與眉心自然銜接。</li><li><strong>側面</strong>：希望鼻尖有適度突出度，鼻背到鼻尖過渡順暢，不要過翹或過長。</li></ol>`,close:"關閉",prev:"上一張",next:"下一張"},ko:{intro:`<p>아이유, 수지, 김유정의 자연스럽고 섬세한 코 모양을 참고하고 싶습니다.</p><p><strong>전체 목표: 자연스럽고 단아하며 부드러운 입체감, 뚜렷한 인공적인 느낌은 피하고 싶습니다.</strong></p><ol><li><strong>코끝</strong>: 더 모이고 섬세하되 자연스러운 둥근 느낌은 유지하고 싶습니다.</li><li><strong>콧볼</strong>: 적당히 좁혀 퍼짐과 좌우 비대칭을 개선하고 싶습니다.</li><li><strong>콧구멍</strong>: 자연스러운 모양과 좌우 균형을 원합니다.</li><li><strong>콧대</strong>: 섬세하고 매끄러운 선과 자연스러운 입체감을 원합니다.</li><li><strong>미간</strong>: 너무 높지 않고 미간과 자연스럽게 이어지기를 원합니다.</li><li><strong>옆모습</strong>: 코끝의 적당한 돌출과 콧대에서 코끝까지 매끄러운 연결을 원하며, 지나치게 들리거나 길지 않았으면 합니다.</li></ol>`,close:"닫기",prev:"이전 사진",next:"다음 사진"},en:{intro:`<p>I would like to reference the naturally refined noses of IU, Suzy, and Kim Yoo-jung.</p><p><strong>Overall goal: natural, delicate, softly defined, without an obvious artificial look.</strong></p><ol><li><strong>Tip</strong>: More focused and refined, while keeping a natural softness.</li><li><strong>Alar base</strong>: Moderately narrower, improving flaring and left-right asymmetry.</li><li><strong>Nostrils</strong>: Natural shape and balanced on both sides.</li><li><strong>Bridge</strong>: Fine, smooth lines with natural definition.</li><li><strong>Radix</strong>: Not too high, blending naturally with the area between the brows.</li><li><strong>Profile</strong>: Moderate tip projection and a smooth transition from bridge to tip, without being too upturned or long.</li></ol>`,close:"Close",prev:"Previous photo",next:"Next photo"}};
